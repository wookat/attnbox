<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("attnbox:theme");
        } catch {
          /* storage unavailable — fall back to the system preference */
        }
        const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#09090b");
        }
      })();
    </script>
    <meta
      name="description"
      content="attnbox — a local-first attention inbox showing which of your AI coding agents (Claude Code, Codex, Gemini, Devin) is waiting on you and what it needs."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>attnbox — agent attention inbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
